
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Merci pour votre demande | BFT Maroc</title>
  <meta name="description" content="Merci d'avoir contacté BEST FIBRE TECHNOLOGY. Votre demande de devis a bien été prise en compte.">

  <link rel="icon" href="images/favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071426, #102d4b);
      color: white;
    }

    .confirmation {
      max-width: 600px;
      width: 100%;
      padding: 55px 35px;
      text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .check {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #16a36a;
      font-size: 45px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 18px;
    }

    p {
      color: #c8d6e5;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .brand {
      color: #53b8ff;
      font-weight: bold;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    a {
      display: inline-block;
      padding: 14px 28px;
      background: #168ee8;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    a:hover {
      background: #0874c5;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .confirmation {
        padding: 40px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="confirmation">
    <div class="check">✓</div>

    <div class="brand">BEST FIBRE TECHNOLOGY</div>

    <h1>Merci pour votre demande !</h1>

    <p>
      Votre demande de devis a bien été envoyée.<br>
      Notre équipe vous contactera dans les meilleurs délais
      afin d'étudier votre besoin.
    </p>

    <a href="index.html">Retour à l'accueil</a>
  </main>
</body>
</html>
